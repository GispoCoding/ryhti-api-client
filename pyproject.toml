[project]
name = "ryhti-api-client"
version = "2026.8.0"
description = "Api Client for the Finnish Built environment information system Ryhti (Rakennetun ympäristön tietojärjestelmä)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gispo Ltd", email = "info@gispo.fi" }
]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11",
    "python-dateutil>=2.8.2",
    "typing-extensions>=4.7.1",
    "urllib3>=2.1.0,<3.0.0",
]

[project.urls]
Repository = "https://github.com/GispoCoding/ryhti-api-client"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # The generator needs Python 3.10+, the client itself supports 3.9
    "openapi-generator-cli[jdk4py]>=7.25.0; python_version >= '3.10'",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "ruff>=0.16.5",
    "types-python-dateutil>=2.9.0.20250708",
]

[tool.ruff.lint]
# Pin the classic default rule set. Newer ruff versions default to a much larger
# "recommended" set that the generated code does not satisfy.
select = ["E4", "E7", "E9", "F"]
ignore = ["F841", "E721"]
unfixable = [
    "F401", # unused imports
    "F841", # unused variables
]
